services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: biblioteca
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    # expose, no ports: visible en la red interna, no desde el host.
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg://biblioteca:${POSTGRES_PASSWORD}@db:5432/biblioteca
      SECRET_KEY: ${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    # El unico puerto publicado de todo el sistema.
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/var/www/biblioteca/static:ro
    depends_on:
      - web

volumes:
  datos_pg:
