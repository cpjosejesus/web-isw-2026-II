# Peldano 1: nginx sirviendo archivos del disco.
#
# Todavia no hay proxy ni Flask en esta configuracion: solo un servidor
# que recibe una peticion, busca un archivo y lo devuelve.

server {
    listen 80;
    server_name localhost;

    root /var/www/biblioteca;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Los estaticos de la aplicacion, servidos directamente desde el disco.
    location /static/ {
        alias /var/www/biblioteca/static/;
        expires 30d;
    }
}
