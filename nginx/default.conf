# Peldano 4: HTTPS terminado en nginx.
#
# El cifrado se abre en el borde. Hacia adentro sigue viajando HTTP por
# la red interna de compose, que no sale de la maquina.

# Nadie se queda en http: todo se redirige al 443.
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Protecciones que valen para todo el sitio, no solo para una ruta.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/json application/javascript;

    location /static/ {
        alias /var/www/biblioteca/static/;
        expires 30d;
    }

    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Ahora si dice "https": por eso ProxyFix importa.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
