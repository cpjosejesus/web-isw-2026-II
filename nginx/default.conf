# Peldano 2: nginx delante de Flask.
#
# Los estaticos los sigue sirviendo nginx desde el disco. Todo lo demas
# se reenvia a la aplicacion, que ya no publica ningun puerto al host.

server {
    listen 80;
    server_name localhost;

    # Nginx los lee del disco: no pasan por Python.
    location /static/ {
        alias /var/www/biblioteca/static/;
        expires 30d;
    }

    location / {
        proxy_pass http://web:8000;

        # Sin estas cuatro lineas Flask cree que todas las peticiones
        # vienen de nginx, y url_for genera enlaces equivocados.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
