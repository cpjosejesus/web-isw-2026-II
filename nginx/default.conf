# Peldano 5: varias replicas detras del mismo borde.
#
# proxy_pass ya no apunta a un host sino a un grupo. Todo lo anterior
# -TLS, cabeceras, estaticos- queda exactamente igual.

upstream biblioteca {
    least_conn;

    # Compose resuelve "web" a las IPs de todas las replicas levantadas
    # con --scale. Ojo: nginx resuelve el nombre al arrancar, asi que si
    # escalan con nginx ya corriendo hay que recargarlo.
    server web:8000 max_fails=3 fail_timeout=30s;
}

# Nadie se queda en http: todo se redirige al 443.
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Protecciones que valen para todo el sitio, no solo para una ruta.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/json application/javascript;

    location /static/ {
        alias /var/www/biblioteca/static/;
        expires 30d;
    }

    location / {
        proxy_pass http://biblioteca;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Ahora si dice "https": por eso ProxyFix importa.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
