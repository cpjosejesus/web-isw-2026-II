# Peldano 6: la peticion mas rapida es la que nunca llega a Flask.
#
# Nginx guarda la respuesta del catalogo unos segundos y la devuelve el
# mismo, y rechaza en el borde al cliente que abusa.

# Zona de cache en disco, con 10 MB de indice en memoria.
proxy_cache_path /var/cache/nginx keys_zone=biblio:10m max_size=200m;

# Zona de conteo por IP: 10 peticiones por segundo.
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

upstream biblioteca {
    least_conn;

    # Compose resuelve "web" a las IPs de todas las replicas levantadas
    # con --scale. Ojo: nginx resuelve el nombre al arrancar, asi que si
    # escalan con nginx ya corriendo hay que recargarlo.
    server web:8000 max_fails=3 fail_timeout=30s;
}

# Nadie se queda en http: todo se redirige al 443.
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Protecciones que valen para todo el sitio, no solo para una ruta.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;

    client_max_body_size 5m;

    gzip on;
    gzip_types text/css application/json application/javascript;

    location /static/ {
        alias /var/www/biblioteca/static/;
        expires 30d;
    }

    # El catalogo es igual para todos: se puede cachear.
    location /libros {
        proxy_pass http://biblioteca;

        proxy_cache biblio;
        proxy_cache_valid 200 30s;
        proxy_cache_methods GET HEAD;
        # Si la aplicacion se cae, servimos lo viejo antes que un error.
        proxy_cache_use_stale error timeout updating;

        # HIT o MISS, visible en las DevTools. Ojo: un add_header dentro
        # de un location descarta los del bloque server, asi que hay que
        # repetir los de seguridad aqui.
        add_header X-Cache-Status $upstream_cache_status;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Escribir nunca se cachea, y ademas se limita.
    location /libros/crear {
        limit_req zone=general burst=20 nodelay;

        proxy_pass http://biblioteca;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://biblioteca;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Ahora si dice "https": por eso ProxyFix importa.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
